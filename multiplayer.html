    .control {

<div class="page">

<script>
"use strict";

/* =========================================================
   NEX STRIKE CLIENT
   ========================================================= */

const SUPABASE_URL =
  "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZQ6oY0Re5QuerLsHOtYIQ_llOyeB94";

const FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/nex-match";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let session = null;
let channel = null;
let matchId = null;
let myPlayerId = null;

let players = [];

let playerName = "PLAYER";
let roomCode = "NEX-PUBLIC-001";

let localX = 50;
let localY = 50;

let moving = {
  up: false,
  down: false,
  left: false,
  right: false
};

let moveTimer = null;
let snapshotTimer = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const lobby =
  document.getElementById("lobby");

const game =
  document.getElementById("game");

const launchButton =
  document.getElementById("launchButton");

const playerNameInput =
  document.getElementById("playerName");

const roomCodeInput =
  document.getElementById("roomCode");

const message =
  document.getElementById("message");

const onlineStatus =
  document.getElementById("onlineStatus");

const connection =
  document.getElementById("connection");

const arena =
  document.getElementById("arena");

const waiting =
  document.getElementById("waiting");

const health =
  document.getElementById("health");

const kills =
  document.getElementById("kills");

const score =
  document.getElementById("score");

const deadScreen =
  document.getElementById("deadScreen");


/* =========================================================
   SAFE MESSAGE
   ========================================================= */

function setMessage(text) {
  message.textContent = text;
}


/* =========================================================
   SHOW GAME
   ========================================================= */

function showGame() {
  lobby.style.display = "none";
  game.style.display = "block";
}


/* =========================================================
   SHOW LOBBY
   ========================================================= */

function showLobby() {
  game.style.display = "none";
  lobby.style.display = "flex";
}


/* =========================================================
   SERVER REQUEST
   ========================================================= */

async function serverRequest(action, data = {}) {

  if (!session) {
    throw new Error("Authentication session missing.");
  }

  const response = await fetch(FUNCTION_URL, {
    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization":
        "Bearer " + session.access_token
    },

    body: JSON.stringify({
      action,
      ...data
    })
  });

  const text = await response.text();

  let result;

  try {
    result = text ? JSON.parse(text) : {};
  } catch {
    throw new Error(
      "Server returned invalid response."
    );
  }

  if (!response.ok) {
    throw new Error(
      result.error ||
      result.message ||
      "Server request failed."
    );
  }

  if (result.error) {
    throw new Error(result.error);
  }

  return result;
}


/* =========================================================
   AUTHENTICATION
   ========================================================= */

async function authenticate() {

  connection.textContent = "AUTHENTICATING";
  onlineStatus.textContent = "CONNECTING";

  const current =
    await supabaseClient.auth.getSession();

  session = current.data.session;

  if (!session) {

    const result =
      await supabaseClient.auth.signInAnonymously();

    if (result.error) {
      throw result.error;
    }

    session = result.data.session;
  }

  if (!session) {
    throw new Error(
      "Unable to create online session."
    );
  }
}


/* =========================================================
   REALTIME
   ========================================================= */

function setupRealtime() {

  if (channel) {
    supabaseClient.removeChannel(channel);
  }

  channel =
    supabaseClient.channel(
      "nex-strike:" + roomCode
    );

  channel
    .on(
      "broadcast",
      { event: "server_snapshot" },
      payload => {
        processSnapshot(payload.payload);
      }
    )

    .on(
      "broadcast",
      { event: "server_move" },
      payload => {
        processMove(payload.payload);
      }
    )

    .on(
      "broadcast",
      { event: "server_combat" },
      payload => {
        processCombat(payload.payload);
      }
    )

    .on(
      "broadcast",
      { event: "server_respawn" },
      payload => {
        processRespawn(payload.payload);
      }
    )

    .subscribe(status => {

      if (status === "SUBSCRIBED") {
        connection.textContent = "ONLINE";
        connection.style.color = "#55df85";
      }

      if (status === "CHANNEL_ERROR") {
        connection.textContent = "CHANNEL ERROR";
      }

      if (status === "TIMED_OUT") {
        connection.textContent = "TIMEOUT";
      }
    });
}


/* =========================================================
   JOIN
   ========================================================= */

async function joinMatch() {

  const result =
    await serverRequest(
      "join",
      {
        roomCode,
        playerName
      }
    );

  if (result.match) {
    matchId =
      result.match.id;
  }

  if (result.player) {
    myPlayerId =
      result.player.id ||
      result.player.player_id;
  }

  if (result.player) {
    localX =
      Number(result.player.pos_x ?? 50);

    localY =
      Number(result.player.pos_y ?? 50);
  }

  if (Array.isArray(result.players)) {
    players = result.players;
    renderPlayers();
  }

  if (Array.isArray(result.state)) {
    players = result.state;
    renderPlayers();
  }

  if (result.state &&
      Array.isArray(result.state.players)) {
    players =
      result.state.players;

    renderPlayers();
  }

  waiting.style.display =
    "block";

  if (
    result.match &&
    result.match.status === "active"
  ) {
    waiting.style.display =
      "none";
  }
}


/* =========================================================
   SNAPSHOT
   ========================================================= */

function processSnapshot(data) {

  if (!data) return;

  if (data.match) {
    matchId =
      data.match.id ||
      matchId;
  }

  if (data.player) {

    myPlayerId =
      data.player.id ||
      data.player.player_id ||
      myPlayerId;

    localX =
      Number(data.player.pos_x ?? localX);

    localY =
      Number(data.player.pos_y ?? localY);
  }

  if (Array.isArray(data.players)) {
    players =
      data.players;

    renderPlayers();
  }

  if (
    data.state &&
    Array.isArray(data.state.players)
  ) {
    players =
      data.state.players;

    renderPlayers();
  }

  if (
    data.match &&
    data.match.status === "active"
  ) {
    waiting.style.display = "none";
  }
}


/* =========================================================
   SERVER MOVE
   ========================================================= */

function processMove(data) {

  if (!data) return;

  if (data.player) {

    const id =
      data.player.id ||
      data.player.player_id;

    const index =
      players.findIndex(
        p =>
          (p.id || p.player_id) === id
      );

    if (index >= 0) {
      players[index] =
        {
          ...players[index],
          ...data.player
        };
    } else {
      players.push(data.player);
    }
  }

  if (data.players) {
    players = data.players;
  }

  renderPlayers();
}


/* =========================================================
   COMBAT
   ========================================================= */

function processCombat(data) {

  if (!data) return;

  if (data.players) {
    players = data.players;
    renderPlayers();
  }

  if (data.player) {

    const id =
      data.player.id ||
      data.player.player_id;

    const index =
      players.findIndex(
        p =>
          (p.id || p.player_id) === id
      );

    if (index >= 0) {
      players[index] =
        {
          ...players[index],
          ...data.player
        };
    }
  }

  renderPlayers();

  const me =
    getMyPlayer();

  if (me) {

    health.textContent =
      Number(me.health ?? 100);

    kills.textContent =
      Number(me.kills ?? 0);

    score.textContent =
      Number(me.score ?? 0);

    if (
      me.alive === false ||
      Number(me.health) <= 0
    ) {
      deadScreen.style.display =
        "flex";
    }
  }
}


/* =========================================================
   RESPAWN
   ========================================================= */

function processRespawn(data) {

  if (!data) return;

  if (data.players) {
    players = data.players;
    renderPlayers();
  }

  if (data.player) {

    const id =
      data.player.id ||
      data.player.player_id;

    const index =
      players.findIndex(
        p =>
          (p.id || p.player_id) === id
      );

    if (index >= 0) {
      players[index] =
        {
          ...players[index],
          ...data.player
        };
    }
  }

  const me =
    getMyPlayer();

  if (me) {

    health.textContent =
      Number(me.health ?? 100);

    kills.textContent =
      Number(me.kills ?? 0);

    score.textContent =
      Number(me.score ?? 0);
  }

  deadScreen.style.display =
    "none";

  renderPlayers();
}


/* =========================================================
   FIND MY PLAYER
   ========================================================= */

function getMyPlayer() {

  return players.find(
    p =>
      (p.id || p.player_
