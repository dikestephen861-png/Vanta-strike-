<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>NEX STRIKE</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #05070a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 20%, #17202b 0, #080b10 42%, #030405 100%);
    }

    .brand {
      text-align: center;
      margin-bottom: 42px;
    }

    .brand-mark {
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      border: 2px solid #e6edf3;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -2px;
      transform: skew(-6deg);
      box-shadow: 0 0 35px rgba(255,255,255,.08);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 5px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 8px;
      color: #8994a0;
      letter-spacing: 4px;
      font-size: 11px;
    }

    .panel {
      background: rgba(15, 19, 25, .92);
      border: 1px solid #28313b;
      border-radius: 18px;
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #9ba6b2;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #43e07b;
      border-radius: 50%;
      box-shadow: 0 0 14px #43e07b;
    }

    .launch {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      background: #fff;
      color: #05070a;
      text-decoration: none;
      text-align: center;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 15px;
    }

    .launch:active {
      transform: scale(.98);
    }

    .footer {
      text-align: center;
      color: #59636d;
      font-size: 10px;
      margin-top: 22px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <main class="screen">

    <div class="brand">
      <div class="brand-mark">NS</div>
      <h1>NEX STRIKE</h1>
      <div class="subtitle">ONLINE COMBAT SYSTEM</div>
    </div>

    <section class="panel">

      <div class="status">
        <span class="dot"></span>
        ONLINE SYSTEM READY
      </div>

      <a class="launch" href="multiplayer.html">
        ENTER COMBAT
      </a>

    </section>

    <div class="footer">
      NEX STRIKE • ONLINE MULTIPLAYER
    </div>

  </main>

</body>
  </html>
